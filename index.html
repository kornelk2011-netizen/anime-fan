<!DOCTYPE html>

<html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime.Fan</title>

<style> *{box-sizing:border-box} body{ margin:0; background:#08080d; color:#fff; font-family:Arial,Helvetica,sans-serif; } header{ position:sticky; top:0; z-index:1000; background:rgba(12,12,18,.97); border-bottom:1px solid #292933; backdrop-filter:blur(15px); } .header{ max-width:1500px; margin:auto; padding:16px 25px; display:flex; align-items:center; gap:25px; } .logo{ font-size:30px; font-weight:900; color:#a855f7; white-space:nowrap; } .logo span{color:#fff} .search{ flex:1; background:#1a1a22; border:1px solid #363640; color:#fff; padding:14px 20px; border-radius:25px; font-size:16px; outline:none; } .search:focus{border-color:#a855f7} .container{ max-width:1500px; margin:auto; padding:35px 25px; } h1{ margin:0 0 8px; font-size:38px; } .subtitle{ color:#9999a6; margin-bottom:25px; } .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px; } .filter{ background:#191920; color:#ddd; border:1px solid #30303b; padding:9px 13px; border-radius:8px; cursor:pointer; } .filter:hover{ border-color:#a855f7; } .filter.active{ background:#a855f7; color:white; border-color:#a855f7; } #status{ color:#999; margin-bottom:22px; } .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px; } .card{ background:#13131b; border:1px solid #292933; border-radius:12px; overflow:hidden; cursor:pointer; transition:.18s; } .card:hover{ transform:translateY(-5px); border-color:#a855f7; box-shadow:0 15px 35px rgba(0,0,0,.5); } .poster{ width:100%; height:285px; object-fit:cover; display:block; background:#20202a; } .info{padding:13px} .title{ font-size:16px; font-weight:bold; line-height:20px; height:40px; overflow:hidden; } .meta{ display:flex; justify-content:space-between; margin-top:9px; font-size:12px; color:#9999a7; } .rating{color:#ffc857} .genres{ margin-top:8px; color:#777785; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #detail{display:none} .back{ background:#191920; color:white; border:1px solid #30303b; padding:11px 18px; border-radius:8px; cursor:pointer; margin-bottom:20px; } .back:hover{background:#a855f7} .detail-box{ background:#13131b; border:1px solid #292933; border-radius:15px; padding:25px; display:flex; gap:30px; } .detail-poster{ width:240px; height:350px; object-fit:cover; border-radius:10px; flex-shrink:0; } .detail-content{flex:1} .detail-title{ font-size:36px; margin:0 0 20px; } .stats{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; } .stat{ background:#1e1e27; padding:10px 14px; border-radius:8px; color:#ddd; } .description{ color:#aaa; line-height:1.7; max-width:1000px; } .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:20px; } .tag{ background:#241a2c; color:#bd7cff; padding:7px 10px; border-radius:6px; font-size:12px; } .seasons{ margin-top:30px; } .seasons select{ width:100%; max-width:700px; background:#181820; color:white; border:1px solid #353541; padding:13px 15px; border-radius:8px; font-size:15px; } .sources{ margin-top:30px; } .region{ background:#17171f; border:1px solid #30303b; padding:15px; border-radius:9px; margin-bottom:15px; } .source-list{ display:flex; flex-wrap:wrap; gap:10px; } .source{ display:flex; align-items:center; gap:10px; background:#1a1a22; border:1px solid #353541; padding:13px 16px; border-radius:9px; text-decoration:none; color:white; } .source:hover{ border-color:#a855f7; } .source-name{font-weight:bold} .source-type{ font-size:11px; color:#999; } .justwatch{ margin-top:15px; padding:15px; border-radius:9px; background:#17171f; border:1px solid #30303b; color:#bbb; } .justwatch a{ color:#c084fc; text-decoration:none; font-weight:bold; } .justwatch a:hover{text-decoration:underline} .no-source{ background:#1a1515; border:1px solid #493030; color:#e7aaaa; padding:15px; border-radius:9px; } .loading{ text-align:center; padding:80px; color:#999; } .hidden{display:none!important} @media(max-width:700px){ .header{ flex-direction:column; align-items:stretch; } .detail-box{ flex-direction:column; } .detail-poster{ width:190px; height:275px; } .detail-title{ font-size:28px; } .grid{ grid-template-columns:repeat(2,1fr); gap:10px; } .poster{ height:250px; } } </style>

</head>

<body>

<header> <div class="header">

<div class="logo"> Anime<span>.Fan</span> </div>

<input
id="search"
class="search"
type="text"
placeholder="🔎 Szukaj anime..."




</div> </header>

<main class="container">

<section id="catalog">

<h1>Biblioteka Anime</h1>

<div class="subtitle"> Anime • sezony • gatunki • legalne źródła w Polsce </div>

<div class="filters" id="filters">

<button class="filter active" data-filter="ALL">Wszystkie</button>
<button class="filter" data-filter="ACTION">⚔️ Akcja</button>
<button class="filter" data-filter="ADVENTURE">🗺️ Przygoda</button>
<button class="filter" data-filter="FANTASY">🧙 Fantasy</button>
<button class="filter" data-filter="HORROR">👻 Horror</button>
<button class="filter" data-filter="ROMANCE">❤️ Romans</button>
<button class="filter" data-filter="COMEDY">😂 Komedia</button>
<button class="filter" data-filter="DRAMA">🎭 Dramat</button>
<button class="filter" data-filter="MYSTERY">🔍 Tajemnica</button>
<button class="filter" data-filter="THRILLER">🔪 Thriller</button>
<button class="filter" data-filter="PSYCHOLOGICAL">🧠 Psychologiczne</button>
<button class="filter" data-filter="SUPERNATURAL">👻 Nadprzyrodzone</button>
<button class="filter" data-filter="SPORTS">⚽ Sport</button>
<button class="filter" data-filter="MUSIC">🎵 Muzyka</button>
<button class="filter" data-filter="SCHOOL">🏫 Szkolne</button>
<button class="filter" data-filter="MECHA">🤖 Mecha</button>
<button class="filter" data-filter="HISTORICAL">🏯 Historyczne</button>
<button class="filter" data-filter="MILITARY">🎖️ Wojskowe</button>
<button class="filter" data-filter="SPACE">🚀 Kosmos</button>
<button class="filter" data-filter="VAMPIRE">🧛 Wampiry</button>
<button class="filter" data-filter="DEMONS">😈 Demony</button>
<button class="filter" data-filter="SAMURAI">⚔️ Samurajowie</button>
<button class="filter" data-filter="CRIME">🕵️ Kryminał</button>
<button class="filter" data-filter="MARTIAL_ARTS">🥋 Sztuki walki</button>
<button class="filter" data-filter="ISEKAI">🌌 Isekai</button>
<button class="filter" data-filter="SLICE_OF_LIFE">🌸 Okruchy życia</button>
<button class="filter" data-filter="HAREM">💜 Harem</button>
<button class="filter" data-filter="MAHOU_SHOUJO">✨ Magical Girl</button>

</div>

<div id="status"> ⏳ Przygotowywanie biblioteki... </div>

<div id="grid" class="grid"></div>

</section>

<section id="detail">

<button id="back" class="back"> ← Wróć do biblioteki </button>

<div id="detailBox"></div>

</section>

</main>

<script> const API="https://graphql.anilist.co"; let animeList=[]; let currentFilter="ALL"; let currentSort="POPULARITY_DESC"; const PER_PAGE=50; const TARGET=1400; const LIST_QUERY=` query($page:Int!,$perPage:Int!,$sort:[MediaSort]){ Page(page:$page,perPage:$perPage){ pageInfo{ hasNextPage currentPage } media( type:ANIME isAdult:false sort:$sort ){ id title{ romaji english native } coverImage{ large extraLarge } episodes averageScore popularity genres seasonYear format status } } } `; const DETAIL_QUERY=` query($id:Int!){ Media(id:$id,type:ANIME){ id title{ romaji english native } coverImage{ large extraLarge } description(asHtml:false) episodes averageScore popularity genres seasonYear format status externalLinks{ url site type language } streamingEpisodes{ title url site thumbnail } relations{ edges{ relationType node{ id title{ romaji english native } coverImage{ large extraLarge } episodes season seasonYear format status genres } } } } } `; function titleOf(a){ return a?.title?.english || a?.title?.romaji || a?.title?.native || "Nieznane anime"; } function esc(t){ return String(t||"") .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;"); } const genreNames={ ACTION:"Akcja", ADVENTURE:"Przygoda", COMEDY:"Komedia", DRAMA:"Dramat", FANTASY:"Fantasy", HORROR:"Horror", ROMANCE:"Romans", MYSTERY:"Tajemnica", THRILLER:"Thriller", PSYCHOLOGICAL:"Psychologiczne", SUPERNATURAL:"Nadprzyrodzone", SPORTS:"Sport", MUSIC:"Muzyka", SCHOOL:"Szkolne", MECHA:"Mecha", HISTORICAL:"Historyczne", MILITARY:"Wojskowe", SPACE:"Kosmos", VAMPIRE:"Wampiry", DEMONS:"Demony", SAMURAI:"Samurajowie", CRIME:"Kryminał", MARTIAL_ARTS:"Sztuki walki", ISEKAI:"Isekai", SLICE_OF_LIFE:"Okruchy życia", HAREM:"Harem", MAHOU_SHOUJO:"Magiczne dziewczyny", ECCHI:"Ecchi", PARODY:"Parodia", GOURMET:"Kulinarne", FAMILY:"Rodzinne", PSYCHOLOGICAL:"Psychologiczne", MEMORY:"Pamięć", TIME_TRAVEL:"Podróże w czasie", HIGH_STAKES:"Wysokie stawki" }; function genrePL(g){ return genreNames[g]||g; } function formatPL(f){ const x={ TV:"Serial TV", TV_SHORT:"Krótki serial", MOVIE:"Film", SPECIAL:"Specjalny", OVA:"OVA", ONA:"ONA", MUSIC:"Teledysk" }; return x[f]||f||"—"; } function statusPL(s){ const x={ FINISHED:"Zakończone", RELEASING:"W trakcie emisji", NOT_YET_RELEASED:"Jeszcze niewydane", CANCELLED:"Anulowane", HIATUS:"Przerwa" }; return x[s]||s||"—"; } /* Szybkie pobieranie: najpierw pobieramy tylko podstawowe dane. Nie pobieramy relations/externalLinks dla 1400 anime. */ async function fetchPage(page){ const response=await fetch(API,{ method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body:JSON.stringify({ query:LIST_QUERY, variables:{ page, perPage:PER_PAGE, sort:[currentSort] } }) }); if(!response.ok) throw new Error("Błąd połączenia z AniList."); const json=await response.json(); if(json.errors) throw new Error(json.errors[0].message); return json.data.Page; } async function loadAllAnime(){ document.getElementById("status").textContent= "⚡ Ładowanie biblioteki..."; let page=1; while(animeList.length<TARGET){ try{ const data=await fetchPage(page); const newAnime=data.media.filter( a=>!animeList.some(x=>x.id===a.id) ); animeList.push(...newAnime); render(); document.getElementById("status").textContent= "⚡ Załadowano "+animeList.length+" anime..."; if(!data.pageInfo.hasNextPage) break; page++; }catch(error){ console.error(error); document.getElementById("status").textContent= "❌ Błąd: "+error.message; break; } } if(animeList.length>=TARGET){ animeList=animeList.slice(0,TARGET); document.getElementById("status").textContent= "✅ Biblioteka gotowa — "+animeList.length+" anime"; } render(); } function render(){ const search= document.getElementById("search") .value .toLowerCase() .trim(); let list=animeList.filter(anime=>{ const title=titleOf(anime).toLowerCase(); const searchOK= !search || title.includes(search) || (anime.title?.romaji||"") .toLowerCase() .includes(search) || (anime.title?.native||"") .toLowerCase() .includes(search); const filterOK= currentFilter==="ALL" || (anime.genres||[]).includes(currentFilter); return searchOK&&filterOK; }); const grid=document.getElementById("grid"); if(!list.length){ grid.innerHTML=` <div style=" grid-column:1/-1; text-align:center; padding:80px; color:#999; "> 😢 Nie znaleziono anime. </div>`; return; } grid.innerHTML=list.map(anime=>{ const title=titleOf(anime); const poster= anime.coverImage?.extraLarge || anime.coverImage?.large || "https://placehold.co/400x600/15151d/ffffff?text=Brak"; const score=anime.averageScore? (anime.averageScore/10).toFixed(1):"—"; const genres=(anime.genres||[]) .slice(0,3) .map(genrePL) .join(" • "); return ` <article class="card" onclick="openAnime(${anime.id})"> <img class="poster" src="${poster}" alt="${esc(title)}" loading="lazy" onerror="this.src='https://placehold.co/400x600/15151d/ffffff?text=Brak'" > <div class="info"> <div class="title"> ${esc(title)} </div> <div class="meta"> <span class="rating"> ⭐ ${score} </span> <span> 🎬 ${anime.episodes||"—"} </span> </div> <div class="genres"> ${esc(genres)} </div> </div> </article> `; }).join(""); } async function getAnime(id){ const response=await fetch(API,{ method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body:JSON.stringify({ query:DETAIL_QUERY, variables:{id} }) }); if(!response.ok) throw new Error("Nie udało się pobrać szczegółów."); const json=await response.json(); if(json.errors) throw new Error(json.errors[0].message); return json.data.Media; } function buildJustWatch(title){ const encoded=encodeURIComponent(title); return ` <div class="justwatch"> 🔎 <strong>Dokładna dostępność w Polsce</strong> <br><br> Dokładną aktualną dostępność tego anime na Crunchyroll, Netflix, Max, Disney+, Prime Video, Canal+, SkyShowtime i innych platformach sprawdzisz na JustWatch. <br><br> <a href="https://www.justwatch.com/pl/szukaj?q=${encoded}" target="_blank" rel="noopener noreferrer" > 👉 Sprawdź „${esc(title)}” na JustWatch.pl → </a> </div> `; } function getSources(anime){ const links=anime.externalLinks||[]; const allowed=[ "Crunchyroll", "Netflix", "Amazon Prime Video", "Prime Video", "Disney Plus", "Disney+", "HBO Max", "Max", "Hulu", "Apple TV", "Apple TV+", "YouTube", "Google Play", "Canal+", "CANAL+", "SkyShowtime" ]; const unique=[]; links.forEach(link=>{ if(!link.url||!link.site) return; const match=allowed.some( x=>link.site.toLowerCase() .includes(x.toLowerCase()) ); if(!match) return; if(unique.some( x=>x.site.toLowerCase()===link.site.toLowerCase() )) return; unique.push(link); }); if(!unique.length){ return ` <div class="no-source"> ⚠️ AniList nie posiada potwierdzonego linku do platformy dla tego anime. </div> `; } return unique.map(link=>` <a class="source" href="${link.url}" target="_blank" rel="noopener noreferrer" > <div> <div class="source-name"> 🟢 ${esc(link.site)} </div> <div class="source-type"> Oficjalna platforma </div> </div> </a> `).join(""); } function getSeasons(anime){ const all=[{ id:anime.id, title:titleOf(anime), year:anime.seasonYear, episodes:anime.episodes, format:anime.format }]; (anime.relations?.edges||[]).forEach(edge=>{ if( edge.relationType!=="SEQUEL" && edge.relationType!=="PREQUEL" ) return; const n=edge.node; if(!n) return; if( n.format!=="TV" && n.format!=="TV_SHORT" && n.format!=="ONA" && n.format!=="OVA" ) return; if(all.some(x=>x.id===n.id)) return; all.push({ id:n.id, title:titleOf(n), year:n.seasonYear, episodes:n.episodes, format:n.format }); }); all.sort((a,b)=> (a.year||9999)-(b.year||9999) ); return all; } async function openAnime(id){ document.getElementById("catalog") .classList.add("hidden"); document.getElementById("detail") .style.display="block"; document.getElementById("detailBox") .innerHTML=` <div class="loading"> ⏳ Ładowanie szczegółów anime... </div> `; window.scrollTo({ top:0, behavior:"smooth" }); try{ const anime=await getAnime(id); const title=titleOf(anime); const poster= anime.coverImage?.extraLarge || anime.coverImage?.large || "https://placehold.co/400x600/15151d/ffffff?text=Brak"; const score=anime.averageScore? (anime.averageScore/10).toFixed(1):"—"; const seasons=getSeasons(anime); document.getElementById("detailBox") .innerHTML=` <div class="detail-box"> <img class="detail-poster" src="${poster}" alt="${esc(title)}" > <div class="detail-content"> <h1 class="detail-title"> ${esc(title)} </h1> <div class="stats"> <div class="stat"> ⭐ Ocena: ${score} </div> <div class="stat"> 🎬 Odcinki: ${anime.episodes||"—"} </div> <div class="stat"> 📅 Rok: ${anime.seasonYear||"—"} </div> <div class="stat"> 📺 Format: ${formatPL(anime.format)} </div> <div class="stat"> 📌 Status: ${statusPL(anime.status)} </div> </div> <p class="description"> ${esc(anime.description||"Brak opisu.")} </p> <div class="tags"> ${(anime.genres||[]) .map(g=>` <span class="tag"> ${esc(genrePL(g))} </span> `).join("")} </div> <div class="seasons"> <h2>📺 Sezony / części</h2> <select id="seasonSelect"> ${seasons.map((s,index)=>` <option value="${s.id}" ${s.id===anime.id?"selected":""} > ${index+1}. ${esc(s.title)} ${s.year?" • "+s.year:""} ${s.episodes?" • "+s.episodes+" odc.":""} </option> `).join("")} </select> </div> <div class="sources"> <h2>📺 Gdzie obejrzeć legalnie?</h2> <div class="region"> 🇵🇱 <strong>Polska</strong> <br> <small> Dostępność platform może zmieniać się w zależności od aktualnych licencji. </small> </div> <div class="source-list"> ${getSources(anime)} </div> ${buildJustWatch(title)} </div> </div> </div> `; document.getElementById("seasonSelect") .addEventListener("change",function(){ openAnime(Number(this.value)); }); }catch(error){ document.getElementById("detailBox") .innerHTML=` <div class="loading"> ❌ ${esc(error.message)} </div> `; } } document.getElementById("back") .onclick=()=>{ document.getElementById("detail") .style.display="none"; document.getElementById("catalog") .classList.remove("hidden"); window.scrollTo({ top:0, behavior:"smooth" }); }; document.getElementById("search") .addEventListener("input",render); document.querySelectorAll(".filter") .forEach(button=>{ button.addEventListener("click",()=>{ document.querySelectorAll(".filter") .forEach(x=>x.classList.remove("active")); button.classList.add("active"); currentFilter=button.dataset.filter; render(); }); }); /* Start. */ loadAllAnime(); </script>

</body> </html>
