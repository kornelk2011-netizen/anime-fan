<!DOCTYPE html> <html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Anime.Fan</title> <style> *{ box-sizing:border-box; } body{ margin:0; background:#08080d; color:#fff; font-family:Arial,Helvetica,sans-serif; } header{ position:sticky; top:0; z-index:1000; background:rgba(12,12,18,.97); border-bottom:1px solid #292933; backdrop-filter:blur(15px); } .header{ max-width:1500px; margin:auto; padding:16px 25px; display:flex; align-items:center; gap:25px; } .logo{ font-size:30px; font-weight:900; color:#a855f7; white-space:nowrap; } .logo span{ color:white; } .search{ flex:1; background:#1a1a22; border:1px solid #363640; color:white; padding:14px 20px; border-radius:25px; font-size:16px; outline:none; } .search:focus{ border-color:#a855f7; } .container{ max-width:1500px; margin:auto; padding:35px 25px; } h1{ margin:0 0 8px; font-size:38px; } .subtitle{ color:#9999a6; margin-bottom:25px; } .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:25px; } .filter, .sort{ background:#191920; color:#ddd; border:1px solid #30303b; padding:10px 15px; border-radius:8px; cursor:pointer; } .filter:hover, .sort:hover{ border-color:#a855f7; } .filter.active{ background:#a855f7; color:white; border-color:#a855f7; } #status{ color:#999; margin-bottom:20px; } .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px; } .card{ background:#13131b; border:1px solid #292933; border-radius:12px; overflow:hidden; cursor:pointer; transition:.2s; } .card:hover{ transform:translateY(-5px); border-color:#a855f7; box-shadow:0 15px 35px rgba(0,0,0,.5); } .poster{ width:100%; height:285px; object-fit:cover; display:block; background:#20202a; } .info{ padding:13px; } .title{ font-size:16px; font-weight:bold; line-height:20px; height:40px; overflow:hidden; } .meta{ display:flex; justify-content:space-between; margin-top:9px; font-size:12px; color:#9999a7; } .rating{ color:#ffc857; } .genres{ margin-top:8px; color:#777785; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } /* ========================= PAGINACJA ========================= */ .pagination{ display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:7px; margin:40px 0 20px; } .page-btn{ min-width:42px; height:42px; padding:0 12px; border-radius:8px; border:1px solid #30303b; background:#191920; color:#ddd; cursor:pointer; font-size:14px; } .page-btn:hover{ border-color:#a855f7; color:white; } .page-btn.active{ background:#a855f7; border-color:#a855f7; color:white; } .page-btn:disabled{ opacity:.35; cursor:not-allowed; } .page-dots{ color:#777; padding:0 5px; } /* ========================= LOADING ========================= */ .loading{ grid-column:1/-1; text-align:center; padding:80px 20px; color:#999; font-size:18px; } /* ========================= DETAIL ========================= */ #detail{ display:none; } .back{ background:#191920; color:white; border:1px solid #30303b; padding:11px 18px; border-radius:8px; cursor:pointer; margin-bottom:20px; } .back:hover{ background:#a855f7; } .detail-box{ background:#13131b; border:1px solid #292933; border-radius:15px; padding:25px; display:flex; gap:30px; } .detail-poster{ width:240px; height:350px; object-fit:cover; border-radius:10px; flex-shrink:0; } .detail-content{ flex:1; } .detail-title{ font-size:36px; margin:0 0 20px; } .stats{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; } .stat{ background:#1e1e27; padding:10px 14px; border-radius:8px; color:#ddd; } .description{ color:#aaa; line-height:1.7; max-width:1000px; } .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:20px; } .tag{ background:#241a2c; color:#bd7cff; padding:7px 10px; border-radius:6px; font-size:12px; } /* ========================= SEZONY ========================= */ .seasons{ margin-top:30px; } .seasons select{ width:100%; max-width:650px; background:#181820; color:white; border:1px solid #353541; padding:13px 15px; border-radius:8px; font-size:15px; outline:none; cursor:pointer; } .seasons select:focus{ border-color:#a855f7; } /* ========================= ŹRÓDŁA ========================= */ .sources{ margin-top:30px; } .region{ background:#17171f; border:1px solid #30303b; padding:15px; border-radius:9px; margin-bottom:15px; color:#ddd; } .source-list{ display:flex; flex-wrap:wrap; gap:10px; } .source{ display:flex; align-items:center; gap:10px; background:#1a1a22; border:1px solid #353541; padding:13px 16px; border-radius:9px; text-decoration:none; color:white; transition:.2s; } .source:hover{ border-color:#a855f7; transform:translateY(-2px); } .source-name{ font-weight:bold; } .source-type{ font-size:11px; color:#999; } .justwatch{ display:inline-block; margin-top:12px; background:#a855f7; color:white; padding:12px 16px; border-radius:8px; text-decoration:none; font-weight:bold; } .justwatch:hover{ background:#8e42d5; } .no-source{ background:#1a1515; border:1px solid #493030; color:#e7aaaa; padding:15px; border-radius:9px; } /* ========================= MOBILE ========================= */ @media(max-width:700px){ .header{ flex-direction:column; align-items:stretch; } .detail-box{ flex-direction:column; } .detail-poster{ width:190px; height:275px; } .detail-title{ font-size:28px; } .grid{ grid-template-columns:repeat(2,1fr); gap:10px; } .poster{ height:250px; } .page-btn{ min-width:38px; height:38px; } } </style> </head> <body> <header> <div class="header"> <div class="logo"> Anime<span>.Fan</span> </div> <input id="search" class="search" type="text" placeholder="🔎 Szukaj anime..." > </div> </header> <main class="container"> <section id="catalog"> <h1>Biblioteka Anime</h1> <div class="subtitle"> Anime • legalne źródła • dostępność w Polsce </div> <!-- KATEGORIE --> <div class="filters"> <button class="filter active" data-filter="all"> Wszystkie </button> <button class="filter" data-filter="Action"> ⚔️ Akcja </button> <button class="filter" data-filter="Adventure"> 🗺️ Przygoda </button> <button class="filter" data-filter="Fantasy"> 🧙 Fantasy </button> <button class="filter" data-filter="Horror"> 👻 Horror </button> <button class="filter" data-filter="Romance"> ❤️ Romans </button> <button class="filter" data-filter="Comedy"> 😂 Komedia </button> <button class="filter" data-filter="Drama"> 🎭 Dramat </button> <button class="filter" data-filter="Thriller"> 🔥 Thriller </button> <button class="filter" data-filter="SciFi"> 🚀 Sci-Fi </button> <button class="filter" data-filter="Isekai"> 🌌 Isekai </button> <select id="sort" class="sort"> <option value="popular"> 🔥 Popularność </option> <option value="rating"> ⭐ Najwyżej oceniane </option> <option value="az"> 🔤 Nazwa A → Z </option> <option value="za"> 🔤 Nazwa Z → A </option> <option value="episodes"> 🎬 Najwięcej odcinków </option> </select> </div> <div id="status"> ⏳ Ładowanie strony 1... </div> <div id="grid" class="grid"> <div class="loading"> ⚡ Ładowanie 50 anime... </div> </div> <!-- PAGINACJA --> <div id="pagination" class="pagination"> </div> </section> <!-- ========================= SZCZEGÓŁY ========================= --> <section id="detail"> <button id="back" class="back"> ← Wróć do biblioteki </button> <div id="detailBox"></div> </section> </main> <script> /* ===================================================== API ANILIST ===================================================== */ const API = "https://graphql.anilist.co"; /* ===================================================== LICZBA ANIME NA STRONĘ ===================================================== */ const PER_PAGE = 50; /* ===================================================== AKTUALNA STRONA ===================================================== */ let currentPage = 1; let currentFilter = "all"; let currentAnimeList = []; let searchTimer; /* ===================================================== ZAPYTANIE LISTY ===================================================== */ const LIST_QUERY = ` query( $page:Int, $perPage:Int, $genre:String ){ Page( page:$page, perPage:$perPage ){ pageInfo{ currentPage lastPage hasNextPage total } media( type:ANIME, isAdult:false, genre:$genre, sort:POPULARITY_DESC ){ id title{ romaji english native } coverImage{ large extraLarge } episodes averageScore popularity genres seasonYear format status } } } `; /* ===================================================== ZAPYTANIE WYSZUKIWANIA ===================================================== */ const SEARCH_QUERY = ` query( $search:String, $page:Int, $perPage:Int ){ Page( page:$page, perPage:$perPage ){ pageInfo{ currentPage lastPage hasNextPage total } media( search:$search, type:ANIME, isAdult:false, sort:SEARCH_MATCH ){ id title{ romaji english native } coverImage{ large extraLarge } episodes averageScore popularity genres seasonYear format status } } } `; /* ===================================================== ZAPYTANIE SZCZEGÓŁÓW ===================================================== */ const DETAIL_QUERY = ` query($id:Int){ Media( id:$id, type:ANIME ){ id title{ romaji english native } coverImage{ large extraLarge } description( asHtml:false ) episodes averageScore popularity genres seasonYear format status externalLinks{ id url site type language } relations{ edges{ relationType node{ id title{ romaji english native } episodes seasonYear format status coverImage{ large extraLarge } externalLinks{ id url site type language } } } } } } `; /* ===================================================== ESCAPE ===================================================== */ function escapeHtml(text){ return String(text || "") .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;"); } /* ===================================================== TYTUŁ ===================================================== */ function titleOf(anime){ return ( anime?.title?.english || anime?.title?.romaji || anime?.title?.native || "Nieznane anime" ); } /* ===================================================== GATUNKI ===================================================== */ function translateGenre(genre){ const map = { Action:"Akcja", Adventure:"Przygoda", Comedy:"Komedia", Drama:"Dramat", Fantasy:"Fantasy", Horror:"Horror", Romance:"Romans", Thriller:"Thriller", Mystery:"Tajemnica", Psychological:"Psychologiczne", SciFi:"Science fiction", Sports:"Sport", Supernatural:"Nadprzyrodzone", Music:"Muzyka", School:"Szkolne", Mecha:"Mecha", Historical:"Historyczne", SliceOfLife:"Okruchy życia", Harem:"Harem", MartialArts:"Sztuki walki", Military:"Wojskowe", Space:"Kosmos", Vampire:"Wampiry", Demons:"Demony", Samurai:"Samurajowie", Parody:"Parodia", Crime:"Kryminał", Isekai:"Isekai" }; return map[genre] || genre; } /* ===================================================== FORMAT ===================================================== */ function translateFormat(format){ const map = { TV:"Serial TV", TV_SHORT:"Krótki serial", MOVIE:"Film", SPECIAL:"Specjalny", OVA:"OVA", ONA:"ONA", MUSIC:"Teledysk" }; return map[format] || format || "—"; } /* ===================================================== STATUS ===================================================== */ function translateStatus(status){ const map = { FINISHED:"Zakończone", RELEASING:"W trakcie emisji", NOT_YET_RELEASED:"Jeszcze niewydane", CANCELLED:"Anulowane", HIATUS:"Przerwa" }; return map[status] || status || "—"; } /* ===================================================== POBIERANIE STRONY ===================================================== */ async function loadPage(page=1){ currentPage = page; const grid = document.getElementById("grid"); grid.innerHTML = ` <div class="loading"> ⚡ Ładowanie 50 anime... </div> `; document.getElementById( "status" ).textContent = `⏳ Ładowanie strony ${page}...`; const search = document .getElementById("search") .value .trim(); try{ let response; /* ========================================= WYSZUKIWANIE ========================================= */ if(search){ response = await fetch( API, { method:"POST", headers:{ "Content-Type": "application/json", "Accept": "application/json" }, body:JSON.stringify({ query:SEARCH_QUERY, variables:{ search:search, page:page, perPage:PER_PAGE } }) } ); } /* ========================================= ZWYKŁA LISTA ========================================= */ else{ response = await fetch( API, { method:"POST", headers:{ "Content-Type": "application/json", "Accept": "application/json" }, body:JSON.stringify({ query:LIST_QUERY, variables:{ page:page, perPage:PER_PAGE, genre: currentFilter === "all" ? null : currentFilter } }) } ); } if(!response.ok){ throw new Error( "Błąd połączenia z AniList." ); } const json = await response.json(); if(json.errors){ throw new Error( json.errors .map(x=>x.message) .join(", ") ); } const data = json.data.Page; currentAnimeList = data.media || []; renderCards( currentAnimeList ); renderPagination( data.pageInfo ); document.getElementById( "status" ).textContent = `📚 Strona ${page} • ` + `${data.pageInfo.total} wyników`; window.scrollTo({ top:0, behavior:"smooth" }); } catch(error){ console.error(error); grid.innerHTML = ` <div class="loading"> ❌ Nie udało się załadować anime. <br><br> <small> ${escapeHtml( error.message )} </small> <br><br> <button class="page-btn" onclick="loadPage(${page})"> 🔄 Spróbuj ponownie </button> </div> `; } } /* ===================================================== RENDER KART ===================================================== */ function renderCards(list){ const grid = document.getElementById("grid"); if(!list.length){ grid.innerHTML = ` <div class="loading"> 😢 Nie znaleziono anime. </div> `; return; } grid.innerHTML = list.map(anime=>{ const title = titleOf(anime); const poster = anime.coverImage?.extraLarge || anime.coverImage?.large || "https://placehold.co/400x600/15151d/ffffff?text=Brak+plakatu"; const score = anime.averageScore ? (anime.averageScore/10) .toFixed(1) : "—"; const episodes = anime.episodes || "—"; return ` <article class="card" onclick=" openAnime(${anime.id}) " > <img class="poster" src="${poster}" alt="${escapeHtml(title)}" loading="lazy" onerror=" this.src= 'https://placehold.co/400x600/15151d/ffffff?text=Brak+plakatu' " > <div class="info"> <div class="title"> ${escapeHtml(title)} </div> <div class="meta"> <span class="rating"> ⭐ ${score} </span> <span> 🎬 ${episodes} </span> </div> <div class="genres"> ${(anime.genres || []) .slice(0,3) .map(translateGenre) .map(escapeHtml) .join(" • ") } </div> </div> </article> `; }) .join(""); } /* ===================================================== PAGINACJA ===================================================== */ function renderPagination(pageInfo){ const container = document.getElementById( "pagination" ); const current = pageInfo.currentPage; const last = pageInfo.lastPage; let html = ""; /* POPRZEDNIA */ html += ` <button class="page-btn" ${ current<=1 ? "disabled" : "" } onclick=" loadPage(${current-1}) " > ← </button> `; /* Funkcja dodaje przycisk strony. */ function addPage(number){ html += ` <button class="page-btn ${ number===current ? "active" : "" }" onclick=" loadPage(${number}) " > ${number} </button> `; } /* Jeśli stron jest mało, pokazujemy wszystkie. */ if(last <= 9){ for( let i=1; i<=last; i++ ){ addPage(i); } } /* Dużo stron: 1 2 3 ... 20 */ else{ addPage(1); addPage(2); if(current > 5){ html += ` <span class="page-dots"> ... </span> `; } let start = Math.max( 3, current-1 ); let end = Math.min( last-2, current+1 ); for( let i=start; i<=end; i++ ){ addPage(i); } if(current < last-4){ html += ` <span class="page-dots"> ... </span> `; } addPage(last-1); addPage(last); } /* NASTĘPNA */ html += ` <button class="page-btn" ${ !pageInfo.hasNextPage ? "disabled" : "" } onclick=" loadPage(${current+1}) " > → </button> `; container.innerHTML = html; } /* ===================================================== FILTRY ===================================================== */ document .querySelectorAll(".filter") .forEach(button=>{ button.addEventListener( "click", function(){ document .querySelectorAll(".filter") .forEach( x => x.classList.remove( "active" ) ); this.classList.add( "active" ); currentFilter = this.dataset.filter; loadPage(1); } ); }); /* ===================================================== SORTOWANIE ===================================================== */ document .getElementById("sort") .addEventListener( "change", function(){ /* Sortowanie jest wykonywane na aktualnych 50 wynikach. */ let list = [...currentAnimeList]; if(this.value==="popular"){ list.sort( (a,b)=> (b.popularity||0) - (a.popularity||0) ); } if(this.value==="rating"){ list.sort( (a,b)=> (b.averageScore||0) - (a.averageScore||0) ); } if(this.value==="az"){ list.sort( (a,b)=> titleOf(a) .localeCompare( titleOf(b), "pl" ) ); } if(this.value==="za"){ list.sort( (a,b)=> titleOf(b) .localeCompare( titleOf(a), "pl" ) ); } if(this.value==="episodes"){ list.sort( (a,b)=> (b.episodes||0) - (a.episodes||0) ); } currentAnimeList = list; renderCards(list); } ); /* ===================================================== WYSZUKIWANIE ===================================================== */ document .getElementById("search") .addEventListener( "input", function(){ clearTimeout( searchTimer ); searchTimer = setTimeout( ()=>{ loadPage(1); }, 450 ); } ); /* ===================================================== SEZONY ===================================================== */ function getSeasons(anime){ const seasons = []; if(!anime) return seasons; seasons.push({ id:anime.id, title:titleOf(anime), year:anime.seasonYear || "", episodes:anime.episodes || "—" }); const edges = anime.relations?.edges || []; edges.forEach(edge=>{ if( edge.relationType !== "SEQUEL" && edge.relationType !== "PREQUEL" ){ return; } const node = edge.node; if(!node) return; if( ![ "TV", "TV_SHORT", "ONA", "OVA", "MOVIE" ].includes( node.format ) ){ return; } if( seasons.some( x => x.id === node.id ) ){ return; } seasons.push({ id:node.id, title:titleOf(node), year: node.seasonYear || "", episodes: node.episodes || "—" }); }); seasons.sort( (a,b)=> (a.year||9999) - (b.year||9999) ); return seasons; } /* ===================================================== LEGALNE ŹRÓDŁA ===================================================== */ function getLegalSources(anime){ const links = anime.externalLinks || []; const allowed = [ "Crunchyroll", "Netflix", "Amazon Prime Video", "Prime Video", "Disney Plus", "Disney+", "HBO Max", "Max", "Canal+", "CANAL+", "SkyShowtime", "Apple TV", "Apple TV+", "YouTube", "Google Play" ]; const unique = []; links.forEach(link=>{ if(!link.url) return; const site = link.site || ""; const legal = allowed.some( name => site .toLowerCase() .includes( name.toLowerCase() ) ); if(!legal) return; if( unique.some( x => x.site === site ) ){ return; } unique.push({ site:site, url:link.url }); }); if(!unique.length){ return ` <div class="no-source"> ⚠️ Nie znaleziono potwierdzonego źródła w danych AniList. </div> `; } return unique .map(source=>` <a class="source" href="${source.url}" target="_blank" rel="noopener noreferrer" > <div> <div class="source-name"> 🟢 ${escapeHtml( source.site )} </div> <div class="source-type"> Oficjalne źródło </div> </div> </a> `) .join(""); } /* ===================================================== JUSTWATCH ===================================================== */ function justWatchUrl(title){ return ( "https://www.justwatch.com/pl/szukaj?q=" + encodeURIComponent(title) ); } /* ===================================================== OTWIERANIE ANIME ===================================================== */ async function openAnime(id){ document .getElementById("catalog") .style.display="none"; document .getElementById("detail") .style.display="block"; document .getElementById("detailBox") .innerHTML=` <div class="loading"> ⚡ Ładowanie informacji... </div> `; window.scrollTo({ top:0, behavior:"smooth" }); try{ const response = await fetch( API, { method:"POST", headers:{ "Content-Type": "application/json", "Accept": "application/json" }, body:JSON.stringify({ query:DETAIL_QUERY, variables:{ id:id } }) } ); if(!response.ok) throw new Error( "Błąd połączenia." ); const json = await response.json(); if( json.errors || !json.data?.Media ){ throw new Error( "Nie znaleziono anime." ); } const anime = json.data.Media; renderDetail(anime); } catch(error){ document .getElementById("detailBox") .innerHTML=` <div class="loading"> ❌ Nie udało się pobrać informacji. <br><br> <button class="page-btn" onclick="openAnime(${id})"> 🔄 Spróbuj ponownie </button> </div> `; } } /* ===================================================== SZCZEGÓŁY ===================================================== */ function renderDetail(anime){ const title = titleOf(anime); const poster = anime.coverImage?.extraLarge || anime.coverImage?.large || "https://placehold.co/400x600/15151d/ffffff?text=Brak+plakatu"; const score = anime.averageScore ? (anime.averageScore/10) .toFixed(1) : "—"; const seasons = getSeasons(anime); const sources = getLegalSources(anime); document .getElementById("detailBox") .innerHTML=` <div class="detail-box"> <img class="detail-poster" src="${poster}" alt="${escapeHtml(title)}" onerror=" this.src= 'https://placehold.co/400x600/15151d/ffffff?text=Brak+plakatu' " > <div class="detail-content"> <h1 class="detail-title"> ${escapeHtml(title)} </h1> <div class="stats"> <div class="stat"> ⭐ Ocena: ${score} </div> <div class="stat"> 🎬 Odcinki: ${anime.episodes || "—"} </div> <div class="stat"> 📅 Rok: ${anime.seasonYear || "—"} </div> <div class="stat"> 📺 Format: ${translateFormat( anime.format )} </div> <div class="stat"> 📌 Status: ${translateStatus( anime.status )} </div> </div> <p class="description"> ${escapeHtml( anime.description || "Brak opisu." )} </p> <div class="tags"> ${(anime.genres || []) .map( genre=>` <span class="tag"> ${escapeHtml( translateGenre( genre ) )} </span> ` ) .join("")} </div> ${ seasons.length > 1 ? ` <div class="seasons"> <h2> 📺 Sezony </h2> <select id="seasonSelect"> ${seasons .map( (season,index)=>` <option value="${season.id}" ${ season.id=== anime.id ?"selected" :"" } > ${ index===0 ?"⭐ " :"" } ${escapeHtml( season.title )} ${ season.year ?" • "+ season.year :"" } • ${ season.episodes } odc. </option> ` ) .join("")} </select> </div> ` : "" } <div class="sources"> <h2> 📺 Gdzie obejrzeć legalnie? </h2> <div class="region"> 🇵🇱 <strong> Region: </strong> Polska <br><br> Dokładna dostępność może się zmieniać wraz z licencjami. <br> <a class="justwatch" href="${justWatchUrl(title)}" target="_blank" rel="noopener noreferrer" > 🔎 Sprawdź dokładną dostępność na JustWatch.pl → </a> </div> <div class="source-list"> ${sources} </div> </div> </div> </div> `; const seasonSelect = document.getElementById( "seasonSelect" ); if(seasonSelect){ seasonSelect.addEventListener( "change", function(){ openAnime( Number(this.value) ); } ); } } /* ===================================================== POWRÓT ===================================================== */ document .getElementById("back") .addEventListener( "click", function(){ document .getElementById("detail") .style.display="none"; document .getElementById("catalog") .style.display="block"; window.scrollTo({ top:0, behavior:"smooth" }); } ); /* ===================================================== START ===================================================== */ /* Po wejściu na stronę OD RAZU pobierane jest 50 anime. */ loadPage(1); </script> </body> </html>
